name: Generate snake

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#0077B6&color_dots=#ebedf0,#b3e5fc,#4fc3f7,#0077b6,#0b2545
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00C4CC&color_dots=#161b22,#0b2545,#03396c,#0077b6,#00c4cc

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
